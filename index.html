<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techsharipov — IT va Kiberxavfsizlik</title>
<style>
:root{--ink:#0b1b2b;--mut:#44586b;--glass:rgba(255,255,255,.42);--edge:rgba(255,255,255,.7);--hi:rgba(255,255,255,.9);--sh:rgba(20,50,90,.18);--acc:#0a84ff;--bg1:#cfe6ff;--bg2:#ffd9e8;--bg3:#d5ffe9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf2fb;--mut:#a9bccf;--glass:rgba(30,40,60,.45);--edge:rgba(255,255,255,.16);--hi:rgba(255,255,255,.25);--sh:rgba(0,0,0,.5);--acc:#64b5ff;--bg1:#0b2447;--bg2:#3a1738;--bg3:#0b3a33;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eaf2fb;--mut:#a9bccf;--glass:rgba(30,40,60,.45);--edge:rgba(255,255,255,.16);--hi:rgba(255,255,255,.25);--sh:rgba(0,0,0,.5);--acc:#64b5ff;--bg1:#0b2447;--bg2:#3a1738;--bg3:#0b3a33;color-scheme:dark}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:90px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg1)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40vmax 40vmax at 15% 10%,var(--bg1),transparent 70%),radial-gradient(45vmax 45vmax at 90% 20%,var(--bg2),transparent 70%),radial-gradient(50vmax 50vmax at 60% 100%,var(--bg3),transparent 70%),radial-gradient(30vmax 30vmax at 20% 85%,#7cc0ff55,transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:50}
.g{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 10px 30px var(--sh);border-radius:24px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem}
#clock small{color:var(--mut);font-weight:600;margin-right:6px}
.lang{display:flex;gap:3px}
.lang button,.tb{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:#fff}
.hero{padding:44px 36px;margin-top:10px}
.hero h1{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:800;max-width:16ch}
.hero p{max-width:56ch;color:var(--mut);margin:14px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:600}
section{margin-top:34px}
section>h2{font-size:1.5rem;margin:0 6px 6px}
.lead{color:var(--mut);margin:0 6px 16px;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{padding:20px;border-radius:22px}
.card .ic{font-size:1.6rem}
.card h3{font-size:1.02rem;margin:8px 0 4px}
